modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Leather is worked, not crafted. Flesh hides on the Tanner's Rack, steep them with bark in the Tanner's Vat, choose a Supple, Harness or Hardened finish as they dry, and stitch equipment at the Leatherworker's Bench. Two short minigames decide Integrity and Workmanship; the finish decides how the leather plays.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15.0,)"
    ordering="NONE"
    side="BOTH"
